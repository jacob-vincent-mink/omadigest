<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <!-- The frame yields the two corners occupied by neither end of the quill. -->
    <path d="M105 28H49c-12 0-21 9-21 21v56M151 228h56c12 0 21-9 21-21v-56" stroke-width="18"/>

    <!-- The writing point and spine are one uninterrupted bisector line. -->
    <path d="M48 220 211 40" stroke-width="10"/>

    <!-- A deliberately open, line-drawn feather around that spine. -->
    <path d="M67 199C79 139 124 77 211 40 187 119 132 174 67 199Z" stroke-width="9"/>
  </g>
</svg>
