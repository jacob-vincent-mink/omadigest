name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install connector sandbox
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap
      - run: npm ci
      - name: Run checks
        env:
          # GitHub-hosted runners block the network namespace required by
          # Bubblewrap. Full sandbox execution remains a release-host check.
          OMADIGEST_SKIP_SANDBOX_TESTS: "1"
        run: npm run check
      - name: Verify checked-in broker bundle
        run: git diff --exit-code -- runtime/dist
      - run: node --test integrations/*/connector.test.mjs
      - run: npm audit
      - name: Validate manifest JSON and entry point
        run: |
          node -e 'const m=require("./manifest.json"); if(m.schemaVersion!==1 || m.id!=="io.github.jacob-vincent-mink.omadigest" || m.entryPoints?.barWidget!=="BarWidget.qml") process.exit(1)'
          test -f BarWidget.qml
